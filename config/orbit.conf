# ~/.config/orbit/orbit.conf
#
# Orbit hot-reloads this file: save it and the launcher updates.
# Every line is optional - delete one and it falls back to the default shown.
# Lists are comma separated. Colours are #rrggbb or #aarrggbb.

# [planet]
# Any image file name in planets_dir (extension optional), or:
#   auto    pick from the theme's key colour (needs theme_file)
#   random  a different planet every time the launcher opens
# Bundled: earth jupiter mars moon neptune saturn serpulo sun uranus
planet = moon
planets_dir =
# sphere | rings | auto  (auto = flat rings for saturn, a sphere otherwise)
orbit_style = auto
# How far the planet texture turns as the orbit spins (0 = still)
planet_spin = 30
vignette = true

# [size]
# Diameter of the orbit in px. auto = fit the screen (420-780 px, like the original)
size = auto
min_size = 420
max_size = 780
# Icon tile size as a fraction of the orbit radius (rings use ring_tile_size)
tile_size = 0.22
ring_tile_size = 0.17
icon_scale = 0.72
tile_radius = 12
show_labels = true
# Most apps on the orbit at once
max_apps = 48

# [search bar]
# 0 = fully transparent, 1 = solid
search_opacity = 0.92
# Width as a fraction of the orbit diameter
search_width = 0.7
placeholder = "Search local orbit..."
font_family = Google Sans Flex
font_size = 13
label_font_size = 13

# [colours]
# Follow a theme generator's output (hot-reloaded when it changes):
#   caelestia: ~/.local/state/caelestia/scheme.json
#   matugen:   any JSON output from a matugen template
#   pywal:     ~/.cache/wal/colors.json
theme_file =
theme_mode = dark
# Explicit colours win over the theme file. Leave empty to use the theme/defaults.
primary =
surface_container =
text_colour =
icon_colour =
placeholder_colour =
# Search pill colour ("" = surface_container lifted one step, like caelestia)
search_colour =
tile_colour =
tile_opacity = 0.85
label_background = #0a0b14
label_opacity = 0.75
label_colour = #e6e7f0

# [motion]
# Idle drift in radians per second, and the tilt the orbit settles back to
idle_speed = 0.12
rest_pitch = -0.35
drag_sensitivity = 1.6
animations = true
anim_speed = 1
# Cap the orbit's frame rate to save CPU on high refresh screens (0 = no cap)
max_fps = 0

# [apps]
# Desktop file ids (without .desktop), shown first
favourite_apps =
# Desktop file ids or /regex/ to hide
hidden_apps =
# Search prefixes: >i id  >c category  >d description  >e exec  >w wm class
#                  >g generic name  >k keywords  >t terminal apps
special_prefix = >
# Command put in front of every launch. auto = `uwsm app --` inside a uwsm session.
# Examples:  none    |    uwsm, app, --    |    hyprctl, dispatch, exec, --
launch_prefix = auto
# Terminal for Terminal=true apps (empty = $TERMINAL, else kitty)
# Examples:  foot    |    alacritty, -e    |    wezterm, start, --
terminal =
close_on_launch = true
sort_by_frequency = true
# Launch history lives here (empty = $XDG_STATE_HOME/orbit)
state_dir =

# [window]
# Output to open on: empty = the focused one. Otherwise a connector name or any
# part of the monitor's make/model, e.g.  monitor = DELL U2720Q
monitor =
# > 0 dims everything behind the launcher (and clicking the dim closes it)
backdrop_opacity = 0
backdrop_colour = #000000
# overlay (above fullscreen apps) | top
layer = overlay
# Layer-shell namespace, for Hyprland layerrules (blur etc.)
namespace = orbit
# Hyprland only: blur behind the search pill via a runtime layerrule (like caelestia)
blur = true
blur_ignore_alpha = 0.87
close_on_focus_loss = true
vertical_offset = 0
# gl (GPU, smoothest) | software (CPU raster: ~45 MB less RAM, a bit more CPU).
# Takes effect the next time orbit starts.
renderer = gl
# Icon theme for app icons (empty = detect from qt6ct / kdeglobals / gtk)
icon_theme =
